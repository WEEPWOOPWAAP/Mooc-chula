<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPE Guard — Compliance Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/vendor/chart.umd.js"></script>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 3 6v6c0 5 4 9 9 10 5-1 9-5 9-10V6l-9-4Z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">PPE Guard</div>
        <div class="brand-tag">SAFETY. EVERY TIME.</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a href="#dashboard" class="nav-item" data-route="dashboard">
        <span class="nav-icon">◻</span> Dashboard
      </a>
      <a href="#live" class="nav-item" data-route="live">
        <span class="nav-icon">◎</span> Live Monitoring
      </a>
      <a href="#alerts" class="nav-item" data-route="alerts">
        <span class="nav-icon">🔔</span> Alerts <span class="nav-badge" id="nav-alert-badge">12</span>
      </a>
      <a href="#reports" class="nav-item" data-route="reports">
        <span class="nav-icon">📊</span> Reports
      </a>
      <a href="#workers" class="nav-item" data-route="workers">
        <span class="nav-icon">👤</span> Workers
      </a>
      <a href="#sites" class="nav-item" data-route="sites">
        <span class="nav-icon">📍</span> Sites
      </a>
      <a href="#devices" class="nav-item" data-route="devices">
        <span class="nav-icon">🖥</span> Devices
      </a>
      <a href="#settings" class="nav-item" data-route="settings">
        <span class="nav-icon">⚙</span> Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="help-icon">👤</div>
      <div>
        <div class="help-title">Need Help?</div>
        <div class="help-sub">Contact Support</div>
      </div>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <h1 id="page-title">PPE Compliance Dashboard</h1>
      <div class="topbar-right">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" placeholder="Search workers, sites, devices..." />
        </div>
        <div class="bell">
          🔔
          <span class="bell-badge" id="bell-badge">12</span>
        </div>
        <div class="user-chip">
          <div class="avatar">AU</div>
          <div class="user-meta">
            <div class="user-name">Admin User</div>
            <div class="user-role">System Admin</div>
          </div>
          <span class="chevron">▾</span>
        </div>
      </div>
    </header>

    <main id="content" class="content"></main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
